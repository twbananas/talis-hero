name: Convert JPG to WebP
on: workflow_dispatch        # adds a manual "Run" button in the Actions tab

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # lets the job push the results back
    steps:
      - uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert JPGs in desktop6 and mobile
        run: |
          find desktop9 mobile Mobile8 -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -print0 \
          | while IFS= read -r -d '' f; do
              cwebp -q 80 "$f" -o "${f%.*}.webp"
            done

      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add '*.webp'
          git commit -m "Add WebP versions of JPGs" || echo "Nothing to commit"
          git push
